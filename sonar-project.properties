# Read by the pipeline's SonarQube stage. The project key and name come from the pipeline.
# .gmshield-reports/ is the Dockerfile's test-reports stage, copied in by the pipeline.
# SonarQube reads coverage from lcov.info; the JUnit results are kept as a pipeline artifact.
sonar.sources=src,stand-in-backend
sonar.tests=test
sonar.exclusions=src/server/backend/generated/**,**/*.d.mts
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=.gmshield-reports/lcov.info
